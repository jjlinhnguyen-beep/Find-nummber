<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Show 100 Number Pop!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            z-index: 2;
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #b8c1ec;
            margin-bottom: 30px;
        }

        /* Number Display Box */
        .number-box {
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        #displayNumber {
            font-size: 8rem;
            font-weight: 900;
            color: #00f0ff;
            transition: transform 0.3s ease, color 0.5s ease;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            display: inline-block;
        }

        /* Pop animation class */
        .pop-anim {
            animation: popEffect 0.6s ease;
        }

        @keyframes popEffect {
            0% {
                transform: scale(0.3);
                color: #00f0ff;
                opacity: 0;
            }
            50% {
                transform: scale(1.3);
                color: #ff0055;
                text-shadow: 0 0 30px #ff0055;
            }
            100% {
                transform: scale(1);
                color: #ff0055;
                opacity: 1;
                text-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            }
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background: linear-gradient(45deg, #ff0055, #ff5e00);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-reset {
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            box-shadow: 0 4px 15px rgba(78, 84, 200, 0.4);
        }
        .btn-reset:hover {
            box-shadow: 0 6px 20px rgba(78, 84, 200, 0.6);
        }

        .stats {
            margin-top: 20px;
            font-size: 0.95rem;
            color: #8c92b3;
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <h1>🎉 100 Number Show 🎉</h1>
        <p class="subtitle">Click below to pop out your mystery number!</p>

        <div class="number-box">
            <div id="displayNumber">?</div>
        </div>

        <div class="btn-group">
            <button id="drawBtn" onclick="drawNumber()">Pop Number!</button>
            <button class="btn-reset" onclick="resetGame()">Reset (1-100)</button>
        </div>

        <div class="stats" id="statsText">Remaining numbers: 100 / 100</div>
    </div>

    <script>
        let availableNumbers = Array.from({length: 100}, (_, i) => i + 1);

        // --- FIREWORKS ENGINE ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.15; // gravity
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createFirework() {
            const colors = ['#00f0ff', '#ff0055', '#ffde59', '#4e54c8', '#00ffcc'];
            const startX = canvas.width / 2;
            const startY = canvas.height / 2 - 50;
            const chosenColor = colors[Math.floor(Math.random() * colors.length)];
            
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle(startX, startY, chosenColor));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();

        // --- AUDIO & SPEECH SYNTHESIS ---
        function playPopSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                // Audio context blocked until user interaction
            }
        }

        function speakPhrase(number) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const text = `Pop pop! Where am I? I am number ${number}!`;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.1;
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- GAME LOGIC ---
        function drawNumber() {
            const display = document.getElementById('displayNumber');
            const statsText = document.getElementById('statsText');
            const btn = document.getElementById('drawBtn');

            if (availableNumbers.length === 0) {
                display.innerText = "End!";
                statsText.innerText = "All 100 numbers have been drawn!";
                btn.disabled = true;
                return;
            }

            // Pick a random index from remaining numbers
            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const drawnNumber = availableNumbers.splice(randomIndex, 1)[0];

            // Trigger animation restart
            display.classList.remove('pop-anim');
            void display.offsetWidth; // Trigger reflow
            display.classList.add('pop-anim');

            // Update text
            display.innerText = drawnNumber;
            statsText.innerText = `Remaining numbers: ${availableNumbers.length} / 100`;

            // Trigger effects
            playPopSound();
            createFirework();
            speakPhrase(drawnNumber);
        }

        function resetGame() {
            availableNumbers = Array.from({length: 100}, (_, i) => i + 1);
            const display = document.getElementById('displayNumber');
            const statsText = document.getElementById('statsText');
            const btn = document.getElementById('drawBtn');

            display.classList.remove('pop-anim');
            display.innerText = "?";
            display.style.color = "#00f0ff";
            statsText.innerText = "Remaining numbers: 100 / 100";
            btn.disabled = false;
        }
    </script>
</body>
</html>
