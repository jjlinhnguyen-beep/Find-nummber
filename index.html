<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Show 100 Number Pop with Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            z-index: 2;
            text-align: center;
            padding: 20px;
            max-width: 420px;
            width: 100%;
            margin-right: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #b8c1ec;
            margin-bottom: 20px;
        }

        .number-box {
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        #displayNumber {
            font-size: 6.5rem;
            font-weight: 900;
            color: #00f0ff;
            transition: transform 0.3s ease, color 0.5s ease;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            display: inline-block;
        }

        .pop-anim {
            animation: popEffect 0.6s ease;
        }

        @keyframes popEffect {
            0% {
                transform: scale(0.3);
                color: #00f0ff;
                opacity: 0;
            }
            50% {
                transform: scale(1.3);
                color: #ff0055;
                text-shadow: 0 0 30px #ff0055;
            }
            100% {
                transform: scale(1);
                color: #ff0055;
                opacity: 1;
                text-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            }
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background: linear-gradient(45deg, #ff0055, #ff5e00);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-reset {
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            box-shadow: 0 4px 15px rgba(78, 84, 200, 0.4);
        }
        .btn-reset:hover {
            box-shadow: 0 6px 20px rgba(78, 84, 200, 0.6);
        }

        .stats {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #8c92b3;
        }

        /* 1 to 100 Tracker Grid Panel */
        .grid-panel {
            z-index: 2;
            background: rgba(15, 15, 30, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 15px;
            max-width: 450px;
            width: 100%;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            max-height: 85vh;
            overflow-y: auto;
        }

        .grid-title {
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 10px;
            color: #b8c1ec;
            font-weight: 600;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
        }

        .grid-item {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #8c92b3;
            transition: all 0.3s ease;
        }

        .grid-item.marked {
            background: rgba(255, 0, 85, 0.25);
            border: 2px solid #ff0055;
            color: #ffffff;
            font-weight: bold;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff0055;
        }

        @media(max-width: 900px) {
            body {
                flex-direction: column;
                overflow-y: auto;
                padding: 20px 0;
            }
            .container {
                margin-right: 0;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <h1>🎉 100 Number Show 🎉</h1>
        <p class="subtitle">Click below to pop out your mystery number!</p>

        <div class="number-box">
            <div id="displayNumber">?</div>
        </div>

        <div class="btn-group">
            <button id="drawBtn" onclick="drawNumber()">Pop Number!</button>
            <button class="btn-reset" onclick="resetGame()">Reset</button>
        </div>

        <div class="stats" id="statsText">Remaining numbers: 100 / 100</div>
    </div>

    <div class="grid-panel">
        <div class="grid-title">📊 Board Tracker (1 to 100)</div>
        <div class="number-grid" id="numberGrid"></div>
    </div>

    <script>
        let availableNumbers = Array.from({length: 100}, (_, i) => i + 1);
        let drawnHistory = new Set();

        function buildGrid() {
            const gridContainer = document.getElementById('numberGrid');
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-item';
                cell.id = `grid-num-${i}`;
                cell.innerText = i;
                gridContainer.appendChild(cell);
            }
        }
        buildGrid();

        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.15;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createFirework() {
            const colors = ['#00f0ff', '#ff0055', '#ffde59', '#4e54c8', '#00ffcc'];
            const startX = window.innerWidth <= 900 ? canvas.width / 2 : canvas.width * 0.35;
            const startY = canvas.height / 2 - 50;
            const chosenColor = colors[Math.floor(Math.random() * colors.length)];
            
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle(startX, startY, chosenColor));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();

        function playPopSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function speakPhrase(number) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const text = `Pop pop! Where am I? I am number ${number}!`;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.1;
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        function drawNumber() {
            const display = document.getElementById('displayNumber');
            const statsText = document.getElementById('statsText');
            const btn = document.getElementById('drawBtn');

            if (availableNumbers.length === 0) {
                display.innerText = "End!";
                statsText.innerText = "All 100 numbers have been drawn!";
                btn.disabled = true;
                return;
            }

            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const drawnNumber = availableNumbers.splice(randomIndex, 1)[0];

            drawnHistory.add(drawnNumber);
            const gridCell = document.getElementById(`grid-num-${drawnNumber}`);
            if (gridCell) {
                gridCell.classList.add('marked');
            }

            display.classList.remove('pop-anim');
            void display.offsetWidth;
            display.classList.add('pop-anim');

            display.innerText = drawnNumber;
            statsText.innerText = `Remaining numbers: ${availableNumbers.length} / 100`;

            playPopSound();
            createFirework();
            speakPhrase(drawnNumber);
        }

        function resetGame() {
            availableNumbers = Array.from({length: 100}, (_, i) => i + 1);
            drawnHistory.clear();
            buildGrid();

            const display = document.getElementById('displayNumber');
            const statsText = document.getElementById('statsText');
            const btn = document.getElementById('drawBtn');

            display.classList.remove('pop-anim');
            display.innerText = "?";
            display.style.color = "#00f0ff";
            statsText.innerText = "Remaining numbers: 100 / 100";
            btn.disabled = false;
        }
    </script>
</body>
</html>
