<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Show 100 Number Pop with Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Main Game Panel */
        .container {
            z-index: 2;
            text-align: center;
            padding: 20px;
            max-width: 450px;
            width: 100%;
            margin-right: 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .subtitle {
            font-size: 1rem;
            color: #b8c1ec;
            margin-bottom: 20px;
        }

        /* Number Display Box */
        .number-box {
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        #displayNumber {
            font-size: 7rem;
            font-weight: 900;
            color: #00f0ff;
            transition: transform 0.3s ease, color 0.5s ease;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            display: inline-block;
        }

        /* Pop animation class */
        .pop-anim {
            animation: popEffect 0.6s ease;
        }

        @keyframes popEffect {
            0% {
                transform: scale(0.3);
                color: #00f0ff;
                opacity: 0;
            }
            50% {
                transform: scale(1.3);
                color: #ff0055;
                text-shadow: 0 0 30px #ff0055;
            }
            100% {
                transform: scale(1);
                color: #ff0055;
                opacity: 1;
                text-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            }
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background: linear-gradient(45deg, #ff0055, #ff5e00);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-reset {
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            box-shadow: 0 4px 15px rgba(78, 84, 200, 0.4);
        }
